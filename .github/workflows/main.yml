name: ci

on:
  # Branches only: a pushed v* tag runs these checks inside release.yml
  # instead, so they don't run twice.
  push:
    branches: [ "**" ]
  pull_request:
  # release.yml calls this workflow so a release runs the very same checks.
  workflow_call:

jobs:
  tests:
    name: lint-and-test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # the official GitHub setup-python action can be faster,
      # because GitHub caches the Python versions alongside the runner.
      - name: "Set up Python"
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"

      - name: Install uv and enable caching
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          # Install a specific version of uv (best practice)
          version: "0.8.22"

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      # CI must report problems, not repair them: --fix / plain `format`
      # rewrite files in this throwaway checkout and exit 0, so bad code
      # would still pass. github output annotates the PR diff inline.
      - name: Run ruff lint
        run: uv run ruff check --output-format=github .

      - name: Check ruff formatting
        run: uv run ruff format --check --diff .

      - name: Run ty check
        run: uv run ty check

      - name: Run pytest
        run: uv run pytest

      # A failed snapshot test writes an HTML report with the expected and
      # actual screens side by side; keep it so the diff can be inspected.
      - name: Upload snapshot report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: snapshot-report
          path: snapshot_report.html
          if-no-files-found: ignore
