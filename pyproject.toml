[project]
name = "json-logs-viewer"
version = "0.1.4"
description = "Interactive terminal JSONL log viewer with filter queries and keyboard-first navigation."
readme = "README.md"
license = { file = "LICENSE" }
keywords = [
    "json",
    "jsonl",
    "logs",
    "log-viewer",
    "terminal-ui",
    "textual",
]
authors = [
    { name = "lukmiik", email = "lukaszmlukaszewski@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.12.5",
    "rich>=14.3.1",
    "textual>=7.3.0",
]

[project.optional-dependencies]
# `jlv --serve` (browser mode). Optional: it adds an aiohttp web server stack.
serve = [
    "textual-serve>=1.1.3",
]

[dependency-groups]
dev = [
    # `textual run --dev` / `textual console` for live CSS and debug logs
    "textual-dev>=1.8.0",
    # so `uv sync` can run the --serve tests without --extra serve
    "textual-serve>=1.1.3",
    "ruff>=0.13.2",
    "ty>=0.0.1a21",
    "pre-commit>=4.3.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
]

[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # flake8-annotations (Enforces type hinting)
    "ANN",
    # pydocstyle: docstrings that exist must follow Google style
    "D",
]
ignore = [
    # Docstrings are optional: only write one when the code needs it
    "D1",
    # Google sections (Args:, Returns:, ...) are optional, so don't demand
    # every parameter be documented
    "D417",
]
# Add the `line-too-long` rule to the enforced rule set. By default, Ruff omits rules that
# overlap with the use of a formatter, like Black, but we can override this behavior by
# explicitly adding the rule.
extend-select = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[project.scripts]
json-logs-viewer = "json_logs_viewer:main"
jlv = "json_logs_viewer:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "performance: performance tests (deselected by default, run with -m performance)",
]
addopts = "-m 'not performance'"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
publish-url = "https://upload.pypi.org/legacy/"

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple"
publish-url = "https://test.pypi.org/legacy/"

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"
