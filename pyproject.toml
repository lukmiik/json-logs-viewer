[project]
name = "json-logs-viewer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "lukmiik", email = "lukaszmlukaszewski@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "textual>=7.3.0",
    "textual-dev>=1.8.0",
]
[dependency-groups]
dev = [
    "ruff>=0.13.2",
    "ty>=0.0.1a21",
    "pre-commit>=4.3.0",
]

[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # flake8-annotations (Enforces type hinting)
    "ANN",
]
# Add the `line-too-long` rule to the enforced rule set. By default, Ruff omits rules that
# overlap with the use of a formatter, like Black, but we can override this behavior by
# explicitly adding the rule.
extend-select = ["E501"]

[project.scripts]
json-logs-viewer = "json_logs_viewer:main"

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"
